name: Login Account

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte"
        required: true
        type: string
      password:
        description: "Mot de passe"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: freetron, tronpick, litepick...)"
        required: true
        type: string
      userId:
        description: "USER_ID"
        required: true
        type: string
      proxyIndex:
        description: "Index du proxy (0, 1, 2...)"
        required: false
        type: string
        default: "0"
      initialTimer:
        description: "Timer initial (ex: 60:00)"
        required: false
        type: string
        default: "60:00"
      action:
        description: "Action (login)"
        required: false
        type: string
        default: "login"

# Empêche deux runs simultanés pour le même utilisateur (évite les conflits Git)
concurrency:
  group: login-${{ github.event.inputs.userId }}
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    # ✅ Image personnelle (remplace aliya123-pro)
    container:
      image: ghcr.io/danyjohns152/camoufox-system:latest
      # Pas de credentials nécessaires si l'image est publique
      # Si l'image est privée, décommenter ci-dessous :
      # credentials:
      #   username: ${{ github.actor }}
      #   password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      # ---------- 1. Masquage du mot de passe dans les logs ----------
      - name: Masquer le mot de passe
        env:
          MASK_PASSWORD: ${{ github.event.inputs.password }}
        run: echo "::add-mask::$MASK_PASSWORD"

      # ---------- 2. Checkout du code source privé ----------
      - name: Checkout du dépôt privé (Comando)
        uses: actions/checkout@v4
        with:
          repository: DanyJohns152/Comando
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code
          ref: main

      # ---------- 3. Préparer l'environnement dans le container ----------
      - name: Préparer l'environnement
        working-directory: /app
        run: |
          set -e
          cp -r $GITHUB_WORKSPACE/private-code/. /app/
          chmod -R 777 /app/videos /app/screenshots 2>/dev/null || true
          mkdir -p /app/videos /app/screenshots
          chmod -R 777 /app/videos /app/screenshots
          ls -la /app

      # ---------- 4. Exécuter l'autologin ----------
      - name: Exécuter l'autologin
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: ${{ github.event.inputs.password }}
          TEST_PLATFORM: ${{ github.event.inputs.platform }}
          TEST_PROXY_INDEX: ${{ github.event.inputs.proxyIndex || '0' }}
          TEST_INITIAL_TIMER: ${{ github.event.inputs.initialTimer || '60:00' }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_USERNAME: DanyJohns152
          GH_REPO: Comando
          GH_BRANCH: main
          JP_PROXY_LIST: ${{ secrets.JP_PROXY_LIST }}
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: |
          set -e
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            python test_login_workflow.py

      # ---------- 5. Upload des vidéos (même en cas d'échec) ----------
      - name: Upload des vidéos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-video-${{ github.run_id }}
          path: /app/videos/
          retention-days: 3
          if-no-files-found: warn
