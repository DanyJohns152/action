name: Login Account (Autologin)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action à exécuter (login, logout, refresh...)"
        required: false
        type: string
        default: "login"
      email:
        description: "Email du compte"
        required: true
        type: string
      password:
        description: "Mot de passe"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: freetron, tronpick, litepick...)"
        required: true
        type: string
      userId:
        description: "USER_ID"
        required: true
        type: string
      proxyIndex:
        description: "Index du proxy (0, 1, 2...)"
        required: false
        type: string
        default: "0"
      initialTimer:
        description: "Timer initial (ex: 60:00)"
        required: false
        type: string
        default: "60:00"

permissions:
  contents: read
  packages: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: ghcr.io/danyjohns152/camoufox-system:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Masquer les valeurs sensibles
        env:
          MASK_PASSWORD: ${{ github.event.inputs.password }}
          MASK_EMAIL: ${{ github.event.inputs.email }}
          MASK_USERID: ${{ github.event.inputs.userId }}
        run: |
          echo "::add-mask::$MASK_PASSWORD"
          echo "::add-mask::$MASK_EMAIL"
          echo "::add-mask::$MASK_USERID"

      - name: Checkout du dépôt privé (Comando)
        uses: actions/checkout@v4
        with:
          repository: DanyJohns152/Comando
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code
          ref: main
          persist-credentials: false

      - name: Exécuter l'autologin
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          TEST_ACTION: ${{ github.event.inputs.action || 'login' }}
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: ${{ github.event.inputs.password }}
          TEST_PLATFORM: ${{ github.event.inputs.platform }}
          TEST_PROXY_INDEX: ${{ github.event.inputs.proxyIndex || '0' }}
          TEST_INITIAL_TIMER: ${{ github.event.inputs.initialTimer || '60:00' }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_USERNAME: DanyJohns152
          GH_REPO: Comando
          GH_BRANCH: main
          JP_PROXY_LIST: ${{ secrets.JP_PROXY_LIST }}
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: |
          cp -r $GITHUB_WORKSPACE/private-code/* /app/
          mkdir -p /app/videos /app/screenshots
          xvfb-run --auto-servernum python test_login_workflow.py

      - name: Upload des vidéos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-video-${{ github.run_id }}
          path: /app/videos/
          retention-days: 3
          if-no-files-found: warn
